<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保險報價整合系統 單檔版</title>
  <style>
    :root { --ink:#172438; --muted:#5e6b78; --line:#cbd7e2; --head:#15324d; --head-2:#2f5f7c; --soft:#eef5f9; --paper:#fff; --yellow:#fff200; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif; color:var(--ink); background:#f4f7fa; }
    .shell { min-height:100vh; display:grid; grid-template-rows:auto 1fr; }
    .topbar { background:var(--head); color:#fff; border-bottom:4px solid #5e9fc0; padding:14px 18px 12px; }
    .topbar-inner { display:flex; align-items:center; justify-content:space-between; gap:16px; max-width:1680px; margin:0 auto; }
    .brand h1 { margin:0; font-size:25px; letter-spacing:0; }
    .brand p { margin:4px 0 0; color:#dbeaf2; font-size:13px; }
    .nav { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
    .nav button { border:1px solid rgba(255,255,255,.45); background:rgba(255,255,255,.1); color:#fff; border-radius:8px; padding:9px 14px; font-weight:700; cursor:pointer; }
    .nav button.active { background:var(--yellow); color:#111; border-color:var(--yellow); }
    .home { max-width:1180px; margin:0 auto; padding:28px 18px 34px; }
    .hero { background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:24px; }
    .hero h2 { margin:0 0 8px; font-size:28px; }
    .hero p { margin:0; color:var(--muted); line-height:1.6; }
    .choice-grid { display:grid; grid-template-columns:repeat(2,minmax(260px,1fr)); gap:16px; margin-top:18px; }
    .choice { display:grid; gap:10px; align-content:start; text-align:left; min-height:168px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:18px; cursor:pointer; color:var(--ink); }
    .choice:hover { border-color:#5e9fc0; box-shadow:0 10px 22px rgba(21,50,77,.12); }
    .choice strong { font-size:22px; }
    .choice span { color:var(--muted); line-height:1.55; }
    .choice .tag { justify-self:start; background:var(--soft); border-left:4px solid var(--head-2); color:var(--head); padding:5px 9px; font-size:13px; font-weight:700; }
    .tool-wrap { display:none; min-height:calc(100vh - 86px); background:#f4f7fa; }
    .tool-frame { display:block; width:100%; min-height:calc(100vh - 86px); height:calc(100vh - 86px); border:0; background:#fff; }
    body.tool-mode .home { display:none; }
    body.tool-mode .tool-wrap { display:block; }
    @media (max-width:760px) { .topbar-inner{align-items:flex-start; flex-direction:column;} .nav{justify-content:flex-start;} .choice-grid{grid-template-columns:1fr;} .tool-frame{height:calc(100vh - 134px); min-height:calc(100vh - 134px);} }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1>保險報價整合系統</h1>
          <p>單檔版：移到桌面、隨身碟或傳給同事都可直接使用。</p>
        </div>
        <nav class="nav" aria-label="系統選單"><button type="button" id="homeBtn" class="active">首頁</button></nav>
      </div>
    </header>
    <main>
      <section class="home" id="home">
        <div class="hero">
          <h2>請選擇要製作的報價單</h2>
          <p>商業火災保險與處所公共意外責任保險已整合在這一個 HTML 檔案中，不需要額外資料夾。</p>
          <div class="choice-grid">
            <button class="choice" type="button" data-tool="fire"><span class="tag">Commercial Fire</span><strong>商火報價</strong><span>輸入公司資料、標的物保額、天災與附加險設定，產生商業火災保險原始報價單。</span></button>
            <button class="choice" type="button" data-tool="liability"><span class="tag">Public Liability</span><strong>公共意外險</strong><span>輸入處所資料、坪數、使用性質與責任限額，產生處所公共意外責任保險報價單。</span></button>
          </div>
        </div>
      </section>
      <section class="tool-wrap" id="toolWrap" aria-label="報價工具"><iframe class="tool-frame" id="toolFrame" title="報價工具"></iframe></section>
    </main>
  </div>
  <script>
    const embeddedTools = {
      fire: { title: "商火報價", html: "\u003c!doctype html\u003e\r\n\u003chtml lang=\"zh-Hant\"\u003e\r\n\u003chead\u003e\r\n  \u003cmeta charset=\"utf-8\"\u003e\r\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\r\n  \u003ctitle\u003e商業火災保險報價單系統 第一版\u003c/title\u003e\r\n  \u003cstyle\u003e\r\n    :root {\r\n      --ink: #172438;\r\n      --muted: #5c6b7a;\r\n      --line: #cbd7e2;\r\n      --line-strong: #8ea4b7;\r\n      --head: #15324d;\r\n      --head-2: #2f5f7c;\r\n      --paper: #ffffff;\r\n      --soft: #eef5f9;\r\n      --field: #fff8e3;\r\n      --ok: #2e7d32;\r\n      --danger: #b42318;\r\n    }\r\n    * { box-sizing: border-box; }\r\n    body {\r\n      margin: 0;\r\n      font-family: \"Microsoft JhengHei\", \"Noto Sans TC\", Arial, sans-serif;\r\n      color: var(--ink);\r\n      background: #f4f7fa;\r\n      line-height: 1.45;\r\n    }\r\n    button, input, select, textarea { font: inherit; }\r\n    .topbar {\r\n      background: var(--head);\r\n      color: #fff;\r\n      padding: 16px 22px 14px;\r\n      border-bottom: 4px solid #5e9fc0;\r\n    }\r\n    .topbar h1 {\r\n      margin: 0;\r\n      font-size: 26px;\r\n      letter-spacing: 0;\r\n    }\r\n    .topbar p {\r\n      margin: 5px 0 0;\r\n      color: #dbeaf2;\r\n      font-size: 14px;\r\n    }\r\n    .app {\r\n      display: grid;\r\n      grid-template-columns: minmax(420px, 520px) minmax(680px, 1fr);\r\n      gap: 18px;\r\n      padding: 18px;\r\n      align-items: start;\r\n    }\r\n    .panel, .preview-shell {\r\n      background: var(--paper);\r\n      border: 1px solid var(--line);\r\n      border-radius: 8px;\r\n      overflow: hidden;\r\n    }\r\n    .panel-header {\r\n      display: flex;\r\n      align-items: center;\r\n      justify-content: space-between;\r\n      gap: 10px;\r\n      padding: 10px 14px;\r\n      background: var(--head-2);\r\n      color: #fff;\r\n      font-weight: 700;\r\n    }\r\n    .panel-body { padding: 14px; }\r\n    .section-title {\r\n      margin: 18px 0 8px;\r\n      padding: 7px 10px;\r\n      background: var(--soft);\r\n      border-left: 4px solid var(--head-2);\r\n      font-weight: 700;\r\n    }\r\n    .grid {\r\n      display: grid;\r\n      grid-template-columns: 1fr 1fr;\r\n      gap: 10px;\r\n    }\r\n    label.field {\r\n      display: grid;\r\n      gap: 4px;\r\n      font-size: 13px;\r\n      color: var(--muted);\r\n    }\r\n    input, select, textarea {\r\n      min-width: 0;\r\n      width: 100%;\r\n      border: 1px solid var(--line-strong);\r\n      border-radius: 6px;\r\n      padding: 8px 9px;\r\n      background: var(--field);\r\n      color: var(--ink);\r\n    }\r\n    textarea { min-height: 70px; resize: vertical; }\r\n    input:focus, select:focus, textarea:focus {\r\n      outline: 2px solid #69a9c9;\r\n      outline-offset: 1px;\r\n    }\r\n    .wide { grid-column: 1 / -1; }\r\n    .mini-note { color: var(--muted); font-size: 12px; margin-top: 4px; }\r\n    .toolbar {\r\n      display: flex;\r\n      flex-wrap: wrap;\r\n      gap: 8px;\r\n      margin: 12px 0;\r\n    }\r\n    .btn {\r\n      border: 1px solid #9bb0c2;\r\n      background: #fff;\r\n      color: var(--ink);\r\n      border-radius: 6px;\r\n      padding: 8px 12px;\r\n      cursor: pointer;\r\n      font-weight: 700;\r\n    }\r\n    .btn.primary {\r\n      background: var(--head);\r\n      color: #fff;\r\n      border-color: var(--head);\r\n    }\r\n    .btn.good {\r\n      background: var(--ok);\r\n      color: #fff;\r\n      border-color: var(--ok);\r\n    }\r\n    .btn.danger {\r\n      color: var(--danger);\r\n      border-color: #d49b94;\r\n    }\r\n    .btn:hover { filter: brightness(0.97); }\r\n    table {\r\n      width: 100%;\r\n      border-collapse: collapse;\r\n      table-layout: fixed;\r\n    }\r\n    th, td {\r\n      border: 1px solid var(--line);\r\n      padding: 7px 8px;\r\n      vertical-align: top;\r\n      word-break: break-word;\r\n    }\r\n    th {\r\n      background: var(--head-2);\r\n      color: #fff;\r\n      font-weight: 700;\r\n      text-align: center;\r\n    }\r\n    .input-table td { padding: 5px; }\r\n    .input-table input, .input-table select, .input-table textarea {\r\n      border-radius: 4px;\r\n      padding: 6px;\r\n    }\r\n    .location-block {\r\n      border: 1px solid var(--line);\r\n      border-radius: 8px;\r\n      overflow: hidden;\r\n      margin-bottom: 12px;\r\n      background: #fbfdff;\r\n    }\r\n    .location-head {\r\n      display: flex;\r\n      justify-content: space-between;\r\n      align-items: center;\r\n      gap: 10px;\r\n      padding: 8px 10px;\r\n      background: #e6f0f6;\r\n      font-weight: 700;\r\n    }\r\n    .location-body { padding: 10px; }\r\n    .money-grid {\r\n      display: grid;\r\n      grid-template-columns: repeat(2, minmax(0, 1fr));\r\n      gap: 8px;\r\n    }\r\n    .clause-box {\r\n      border: 1px solid var(--line);\r\n      border-radius: 6px;\r\n      background: #fff;\r\n    }\r\n    .clause-row {\r\n      display: grid;\r\n      grid-template-columns: 34px 74px 1fr;\r\n      gap: 8px;\r\n      align-items: start;\r\n      padding: 7px 8px;\r\n      border-bottom: 1px solid #e7edf3;\r\n      font-size: 13px;\r\n    }\r\n    .clause-row:last-child { border-bottom: 0; }\r\n    .clause-row input { width: 18px; height: 18px; margin: 1px auto 0; }\r\n    .quote {\r\n      background: #fff;\r\n      min-height: 960px;\r\n      padding: 24px;\r\n    }\r\n    .quote-title {\r\n      display: flex;\r\n      justify-content: space-between;\r\n      gap: 16px;\r\n      align-items: end;\r\n      border-bottom: 3px solid var(--head);\r\n      padding-bottom: 10px;\r\n      margin-bottom: 12px;\r\n    }\r\n    .quote-title h2 {\r\n      margin: 0;\r\n      font-size: 28px;\r\n      letter-spacing: 0;\r\n    }\r\n    .quote-title .meta { text-align: right; color: var(--muted); font-size: 13px; }\r\n    .quote h3 {\r\n      margin: 10px 0 4px;\r\n      font-size: 14px;\r\n      padding: 3px 6px;\r\n      background: #fff200;\r\n      color: #111;\r\n    }\r\n    .quote table { font-size: 12px; }\r\n    .quote th { background: #fff200; color: #111; border-color: #d8d15f; }\r\n    .quote th, .quote td { padding: 4px 6px; }\r\n    .quote td { border-color: #d7dee6; }\r\n    .info-grid {\r\n      display: grid;\r\n      grid-template-columns: 120px 1fr 120px 1fr;\r\n      border: 1px solid var(--line);\r\n      border-bottom: 0;\r\n      font-size: 13px;\r\n    }\r\n    .info-grid \u003e div {\r\n      border-bottom: 1px solid var(--line);\r\n      padding: 7px 8px;\r\n      min-height: 32px;\r\n    }\r\n    .info-label { background: #eef5f9; font-weight: 700; }\r\n    .terms-list {\r\n      columns: 2;\r\n      column-gap: 26px;\r\n      margin: 0;\r\n      padding-left: 18px;\r\n      font-size: 13px;\r\n    }\r\n    .terms-list li { break-inside: avoid; margin: 0 0 4px; }\r\n    .empty {\r\n      color: var(--muted);\r\n      padding: 28px;\r\n      text-align: center;\r\n      border: 1px dashed var(--line-strong);\r\n      background: #fbfdff;\r\n      border-radius: 8px;\r\n    }\r\n    @media (max-width: 1180px) {\r\n      .app { grid-template-columns: 1fr; }\r\n    }\r\n    @media print {\r\n      body { background: #fff; }\r\n      .topbar, .panel, .print-actions { display: none !important; }\r\n      .app { display: block; padding: 0; }\r\n      .preview-shell { border: 0; border-radius: 0; }\r\n      .quote { padding: 12mm; min-height: auto; }\r\n      @page { size: A4 landscape; margin: 8mm; }\r\n    }\r\n  \u003c/style\u003e\r\n\u003c/head\u003e\r\n\u003cbody\u003e\r\n  \u003cheader class=\"topbar\"\u003e\r\n    \u003ch1\u003e商業火災保險報價單系統\u003c/h1\u003e\r\n    \u003cp\u003e輸入公司與標的物資料，系統會依保額標的自動建議 SB 附加條款，並產生可列印成 PDF 的報價單。\u003c/p\u003e\r\n  \u003c/header\u003e\r\n\r\n  \u003cmain class=\"app\"\u003e\r\n    \u003csection class=\"panel\"\u003e\r\n      \u003cdiv class=\"panel-header\"\u003e\r\n        \u003cspan\u003eINPUT：報價資料\u003c/span\u003e\r\n        \u003cspan id=\"saveStatus\"\u003e尚未產生\u003c/span\u003e\r\n      \u003c/div\u003e\r\n      \u003cdiv class=\"panel-body\"\u003e\r\n        \u003cdiv class=\"toolbar\"\u003e\r\n          \u003cbutton class=\"btn\" id=\"sampleBtn\" type=\"button\"\u003e帶入範例\u003c/button\u003e\r\n          \u003cbutton class=\"btn\" id=\"clearBtn\" type=\"button\"\u003e清空\u003c/button\u003e\r\n          \u003cbutton class=\"btn primary\" id=\"generateBtn\" type=\"button\"\u003e產生報價單\u003c/button\u003e\r\n          \u003cbutton class=\"btn good\" id=\"printBtn\" type=\"button\"\u003e列印 / 存成 PDF\u003c/button\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"section-title\"\u003e被保險人資訊\u003c/div\u003e\r\n        \u003cdiv class=\"grid\"\u003e\r\n          \u003clabel class=\"field\"\u003e產業別\r\n            \u003cselect id=\"industry\"\u003e\r\n              \u003coption\u003e汽車業\u003c/option\u003e\r\n              \u003coption\u003e一般商業\u003c/option\u003e\r\n              \u003coption\u003e製造業\u003c/option\u003e\r\n              \u003coption\u003e倉儲物流\u003c/option\u003e\r\n              \u003coption\u003e其他\u003c/option\u003e\r\n            \u003c/select\u003e\r\n          \u003c/label\u003e\r\n          \u003clabel class=\"field\"\u003e公司名稱\r\n            \u003cinput id=\"companyName\"\u003e\r\n          \u003c/label\u003e\r\n          \u003clabel class=\"field\"\u003e統一編號\r\n            \u003cinput id=\"taxId\"\u003e\r\n          \u003c/label\u003e\r\n          \u003clabel class=\"field\"\u003e代表人\r\n            \u003cinput id=\"representative\"\u003e\r\n          \u003c/label\u003e\r\n          \u003clabel class=\"field\"\u003e電話\r\n            \u003cinput id=\"phone\"\u003e\r\n          \u003c/label\u003e\r\n          \u003clabel class=\"field wide\"\u003e通訊地址\n            \u003cinput id=\"mailingAddress\"\u003e\n          \u003c/label\u003e\n          \u003clabel class=\"field wide\"\u003e保險期間\n            \u003cinput id=\"insurancePeriod\" placeholder=\"例：2026/07/01 中午12時起至 2027/07/01 中午12時止\"\u003e\n          \u003c/label\u003e\n        \u003c/div\u003e\n\r\n        \u003cdiv class=\"section-title\"\u003e標的物地址與保額\u003c/div\u003e\r\n        \u003cdiv id=\"locations\"\u003e\u003c/div\u003e\r\n        \u003cbutton class=\"btn\" id=\"addLocationBtn\" type=\"button\"\u003e新增標的物地址\u003c/button\u003e\r\n        \u003cp class=\"mini-note\"\u003e金額可輸入 35000000 或 35,000,000；系統會自動加總火險保額並判斷適用的附加條款標的。\u003c/p\u003e\r\n\r\n        \u003cdiv class=\"section-title\"\u003e自負額、天災與備註\u003c/div\u003e\r\n        \u003cdiv class=\"grid\"\u003e\r\n          \u003clabel class=\"field wide\"\u003e自負額\r\n            \u003ctextarea id=\"deductible\"\u003e火險及其他附加險：每一事故為賠償金額之10%，最低NT$3萬元。\u003c/textarea\u003e\r\n          \u003c/label\u003e\r\n          \u003clabel class=\"field\"\u003e天災險保額比例\r\n            \u003cselect id=\"natPercent\"\u003e\u003c/select\u003e\r\n          \u003c/label\u003e\r\n          \u003clabel class=\"field\"\u003e天災保險限額\r\n            \u003cselect id=\"natLimit\"\u003e\u003c/select\u003e\r\n          \u003c/label\u003e\r\n          \u003clabel class=\"field\"\u003e其他附加險比例\r\n            \u003cselect id=\"addonPercent\"\u003e\u003c/select\u003e\r\n          \u003c/label\u003e\r\n          \u003clabel class=\"field wide\"\u003e備註\r\n            \u003ctextarea id=\"remarks\"\u003e\u003c/textarea\u003e\r\n          \u003c/label\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"section-title\"\u003e附加險種與保額\u003c/div\u003e\r\n        \u003ctable class=\"input-table\"\u003e\r\n          \u003cthead\u003e\r\n            \u003ctr\u003e\u003cth style=\"width:46px\"\u003e納入\u003c/th\u003e\u003cth\u003e附加險種\u003c/th\u003e\u003cth style=\"width:170px\"\u003e個別比例（選填）\u003c/th\u003e\u003c/tr\u003e\r\n          \u003c/thead\u003e\r\n          \u003ctbody id=\"covers\"\u003e\u003c/tbody\u003e\r\n        \u003c/table\u003e\r\n        \u003cbutton class=\"btn\" id=\"addCoverBtn\" type=\"button\" style=\"margin-top:8px\"\u003e新增附加險種\u003c/button\u003e\r\n        \u003cp class=\"mini-note\"\u003e個別比例不用每列選；留「依上方設定」即可。只有某個附加險比例不同時，再於該列改成指定比例。\u003c/p\u003e\r\n\r\n        \u003cdiv class=\"section-title\"\u003eSB 附加條款\u003c/div\u003e\r\n        \u003cdiv class=\"toolbar\"\u003e\r\n          \u003cbutton class=\"btn\" id=\"recommendBtn\" type=\"button\"\u003e依保額自動建議\u003c/button\u003e\r\n          \u003cbutton class=\"btn\" id=\"selectAllClausesBtn\" type=\"button\"\u003e全選\u003c/button\u003e\r\n          \u003cbutton class=\"btn\" id=\"clearClausesBtn\" type=\"button\"\u003e清空條款\u003c/button\u003e\r\n          \u003cbutton class=\"btn\" id=\"addCustomClauseBtn\" type=\"button\"\u003e新增自訂條款\u003c/button\u003e\r\n        \u003c/div\u003e\r\n        \u003cdiv class=\"clause-box\" id=\"clauseBox\"\u003e\u003c/div\u003e\r\n        \u003cdiv id=\"customClauseBox\" style=\"margin-top:8px\"\u003e\u003c/div\u003e\r\n      \u003c/div\u003e\r\n    \u003c/section\u003e\r\n\r\n    \u003csection class=\"preview-shell\"\u003e\r\n      \u003cdiv class=\"panel-header print-actions\"\u003e\r\n        \u003cspan\u003eOUTPUT：報價單預覽\u003c/span\u003e\r\n        \u003cspan\u003e可列印成 PDF\u003c/span\u003e\r\n      \u003c/div\u003e\r\n      \u003cdiv class=\"quote\" id=\"quotePreview\"\u003e\r\n        \u003cdiv class=\"empty\"\u003e填完左側資料後，按「產生報價單」。\u003c/div\u003e\r\n      \u003c/div\u003e\r\n    \u003c/section\u003e\r\n  \u003c/main\u003e\r\n\r\n  \u003cscript\u003e\r\n    const SB_CLAUSES = [{\"code\": \"SB001\", \"title\": \"重置成本附加條款(REPLACEMENT COST CLAUSE)\", \"applicability\": \"重置成本條款適用之標的物以建築物、營業裝修、機器設備以及營業生財為主 (僅投保裝修者不宜適用)，而具有中央處理系統之電子設備以投保電子設備保險為原則。 / 重置成本條款以建築物、營業裝修、機器設備以及營業生財為主 (僅投保裝修者不宜適用)，而具有中央處理系統之電子設備以投保電子設備保險為原則\", \"建築物\": true, \"營業生財\": true, \"營業裝修\": true, \"機器設備\": true, \"存貨\": false, \"note\": \"\"}, {\"code\": \"SB002\", \"title\": \"80 %共保附加條款( 80 % CO-INSURANCE CLAUSE )\", \"applicability\": \"以貨物以外之財產為限，至於貨物部份以預約保險方式處理之 以保險標的物價值之 80%作為保險金額，保險金額如未達保險標的物價值之 80%者，仍受到低額保險比例分攤之約束。 加保附加險者，亦與火險相同適用同一共保比例。 竊盜險不適用本條款。 適用本條款時，原則上仍應鼓勵被保險人以足額投保。\", \"建築物\": true, \"營業生財\": true, \"營業裝修\": true, \"機器設備\": true, \"存貨\": false, \"note\": \"文字載明貨物/存貨以外；文字載明貨物以預約保險處理\"}, {\"code\": \"SB003\", \"title\": \"實損實賠保險附加條款( FIRST LOSS INSURANCE CLAUSE )\", \"applicability\": \"\", \"建築物\": false, \"營業生財\": false, \"營業裝修\": false, \"機器設備\": false, \"存貨\": false, \"note\": \"未找到適用之標的物段落\"}, {\"code\": \"SB004\", \"title\": \"保險金額自動增加附加條款(AUTOMATIC CAPITAL ADDITIONS CLAUSE)\", \"applicability\": \"以建築物、營業裝修、機器設備或營業生財為準，至於貨物 則以預約保險方式處理即可克服貨物保額增減不定之狀況。\", \"建築物\": true, \"營業生財\": true, \"營業裝修\": true, \"機器設備\": true, \"存貨\": false, \"note\": \"文字載明貨物以預約保險處理\"}, {\"code\": \"SB005\", \"title\": \"保險金額自動恢復附加條款( AUTOMATIC REINSTATEMENT CLAUSE )\", \"applicability\": \"\", \"建築物\": false, \"營業生財\": false, \"營業裝修\": false, \"機器設備\": false, \"存貨\": false, \"note\": \"未找到適用之標的物段落\"}, {\"code\": \"SB008\", \"title\": \"暫時外移附加條款 ( OFF PREMISES CLAUSE )\", \"applicability\": \"\", \"建築物\": false, \"營業生財\": false, \"營業裝修\": false, \"機器設備\": false, \"存貨\": false, \"note\": \"未找到適用之標的物段落\"}, {\"code\": \"SB009\", \"title\": \"預付賠款附加條款( PAYMENTS ON ACCOUNT CLAUSE )\", \"applicability\": \"無任何限制。\", \"建築物\": true, \"營業生財\": true, \"營業裝修\": true, \"機器設備\": true, \"存貨\": true, \"note\": \"無限制，預設適用全部標的物\"}, {\"code\": \"SB010\", \"title\": \"建築物外部設備附加條款 ( OUTBUILDING CLAUSE )\", \"applicability\": \"不動產及裝修。\", \"建築物\": true, \"營業生財\": false, \"營業裝修\": true, \"機器設備\": false, \"存貨\": false, \"note\": \"\"}, {\"code\": \"SB011\", \"title\": \"擴大承保處所附加條款 ( PREMISES CLAUSE )\", \"applicability\": \"建築物及裝修以外之標的物適用本條款，但置存於庭院內或露天之財物因危險性質不同，仍應依火災保險費率規章費率核定辦法核定費率，並另行估算金額 投保。\", \"建築物\": false, \"營業生財\": true, \"營業裝修\": false, \"機器設備\": true, \"存貨\": true, \"note\": \"文字載明建築物及裝修以外\"}, {\"code\": \"SB012\", \"title\": \"內部遷移附加條款 ( INTERNAL REMOVAL CLAUSE )\", \"applicability\": \"建築物及營業裝修以外之標的物。\", \"建築物\": false, \"營業生財\": true, \"營業裝修\": false, \"機器設備\": true, \"存貨\": true, \"note\": \"文字載明建築物及裝修以外\"}, {\"code\": \"SB013\", \"title\": \"改建與修復附加條款( ALTERATIONS AND REPAIRS CLAUSE )\", \"applicability\": \"貨物以外之標的物。\", \"建築物\": true, \"營業生財\": true, \"營業裝修\": true, \"機器設備\": true, \"存貨\": false, \"note\": \"文字載明貨物/存貨以外\"}, {\"code\": \"SB014\", \"title\": \"拋棄代位求償權附加條款 ( WAIVER OF SUBROGATION RIGHTS CLAUSE )\", \"applicability\": \"被保險人之關係企業或業務上經營管理上有關係之人。\", \"建築物\": false, \"營業生財\": false, \"營業裝修\": false, \"機器設備\": false, \"存貨\": false, \"note\": \"\"}, {\"code\": \"SB015\", \"title\": \"車輛裝載物附加條款 ( VEHICLE LOAD CLAUSE )\", \"applicability\": \"貨物\", \"建築物\": false, \"營業生財\": false, \"營業裝修\": false, \"機器設備\": false, \"存貨\": true, \"note\": \"\"}, {\"code\": \"SB006\", \"title\": \"專業費用附加條款(PROFESSIONAL FEES CLAUSE)\", \"applicability\": \"建築物、營業裝修、機器設備。\", \"建築物\": true, \"營業生財\": false, \"營業裝修\": true, \"機器設備\": true, \"存貨\": false, \"note\": \"\"}, {\"code\": \"SB007\", \"title\": \"殘餘物清除費用附加條款(DEBRIS REMOVAL CLAUSE)\", \"applicability\": \"建築物、營業生財、營業裝修、機器設備、貨物。\", \"建築物\": true, \"營業生財\": true, \"營業裝修\": true, \"機器設備\": true, \"存貨\": true, \"note\": \"\"}, {\"code\": \"SB016\", \"title\": \"理賠準備費用附加條款(CLAIMS PREPARATION COSTS CLAUSE)\", \"applicability\": \"建築物、營業裝修、營業生財、機器設備、貨物。 準備或証明理賠金額所實際發生必要且合理之費用。\", \"建築物\": true, \"營業生財\": true, \"營業裝修\": true, \"機器設備\": true, \"存貨\": true, \"note\": \"\"}, {\"code\": \"SB017\", \"title\": \"建築物拆除及建築費用增加附加條款(DEMOLITION AND INCREASED COST OF CONSTRUCTION CLAUSE)\", \"applicability\": \"建築物。 為執行政府法令規定，於重建、重置或修復保險標的物所發生之額外費用。 / 除貨物外之其他保險標的物，包括建築物、營業裝修、營業生財、機器設備。 列名式之合理趕工費用。 / 除貨物外之其他保險標的物，包括建築物、營業裝修、營業生財、機器設備。 本附加條款所載之額外費用。\", \"建築物\": true, \"營業生財\": true, \"營業裝修\": true, \"機器設備\": true, \"存貨\": true, \"note\": \"\"}, {\"code\": \"SB020\", \"title\": \"消防費用附加條款(FIRE BRIGADE CHARGES AND EXTINGUISHING EXPENSE CLAUSE)\", \"applicability\": \"建築物、營業裝修、營業生財、機器設備、貨物。 消防費用及消防器材費用。\", \"建築物\": true, \"營業生財\": true, \"營業裝修\": true, \"機器設備\": true, \"存貨\": true, \"note\": \"\"}, {\"code\": \"SB021\", \"title\": "}, {\"code\": \"SB074\", \"title\": \"試車/測試附加條款(PLANT \u0026 PROPERTY TESTING AND COMMISSIONING CLAUSE)\", \"applicability\": \"機器設備。\", \"建築物\": false, \"營業生財\": false, \"營業裝修\": false, \"機器設備\": true, \"存貨\": false, \"note\": \"\"}];\r\n    const propertyMap = [\r\n      { key: \"建築物\", label: \"建築物\", field: \"building\" },\r\n      { key: \"營業裝修\", label: \"營業裝修\", field: \"decoration\" },\r\n      { key: \"機器設備\", label: \"機器設備\", field: \"machinery\" },\r\n      { key: \"營業生財\", label: \"營業生財\", field: \"equipment\" },\r\n      { key: \"存貨\", label: \"貨物\", field: \"goods\" }\r\n    ];\r\n    const defaultCovers = [\r\n      \"地震險\",\r\n      \"颱風及洪水險\",\r\n      \"罷工、暴動、民眾騷擾、惡意破壞行為險\",\r\n      \"自動消防裝置滲漏險\",\r\n      \"竊盜險\",\r\n      \"第三人意外責任險\",\r\n      \"水漬險\",\r\n      \"爆炸險\",\r\n      \"航空器墜落、機動車輛碰撞險\",\r\n      \"營業中斷險(製造業適用)\",\r\n      \"營業中斷險(非製造業適用)\",\r\n      \"煙燻險\",\r\n      \"地層下陷、滑動或山崩險\",\r\n      \"租金損失險\",\r\n      \"恐怖主義險\"\r\n    ];\r\n    const els = {};\r\n    const moneyFields = [\"building\", \"decoration\", \"machinery\", \"equipment\", \"goods\"];\r\n    const fieldMeta = {\r\n      building: { label: \"建築物\", key: \"建築物\", aliases: [\"建築物\", \"建物\", \"房屋\"] },\r\n      decoration: { label: \"營業裝修\", key: \"營業裝修\", aliases: [\"營業裝修\", \"裝修\"] },\r\n      machinery: { label: \"機器設備\", key: \"機器設備\", aliases: [\"機器設備\", \"機器\", \"設備\"] },\r\n      equipment: { label: \"營業生財\", key: \"營業生財\", aliases: [\"營業生財\", \"生財\"] },\r\n      goods: { label: \"貨物\", key: \"存貨\", aliases: [\"貨物\", \"存貨\", \"零件\", \"配件\"] }\r\n    };\r\n\r\n    function byId(id) { return document.getElementById(id); }\r\n    function escapeHtml(value) {\r\n      return String(value ?? \"\").replace(/[\u0026\u003c\u003e\"\u0027]/g, ch =\u003e ({\"\u0026\":\"\u0026amp;\",\"\u003c\":\"\u0026lt;\",\"\u003e\":\"\u0026gt;\",\"\\\"\":\"\u0026quot;\",\"\u0027\":\"\u0026#39;\"}[ch]));\r\n    }\r\n    function moneyValue(value) {\r\n      const n = Number(String(value ?? \"\").replace(/[^0-9.-]/g, \"\"));\r\n      return Number.isFinite(n) ? n : 0;\r\n    }\r\n    function fmtMoney(value) {\r\n      const n = moneyValue(value);\r\n      return n ? n.toLocaleString(\"zh-TW\") : \"\";\r\n    }\r\n    function fieldAmountText(value) {\r\n      const amount = fmtMoney(value);\r\n      if (!amount) return \"\";\r\n      const suffix = [...plain(value).matchAll(/[（(]([^（）()]*)[）)]/g)]\r\n        .map(match =\u003e match[1])\r\n        .filter(text =\u003e text.includes(\"含\"))\r\n        .map(text =\u003e `(${escapeHtml(text)})`)\r\n        .join(\"\");\r\n      return amount + suffix;\r\n    }\r\n    function fmtAmountText(value) {\r\n      const text = plain(value);\r\n      if (!text) return \"\";\r\n      if (/^[0-9,]+$/.test(text)) return fmtMoney(text);\r\n      return text.replace(/[0-9][0-9,]*/g, match =\u003e {\r\n        const cleaned = match.replace(/,/g, \"\");\r\n        return cleaned.length \u003e= 4 ? Number(cleaned).toLocaleString(\"zh-TW\") : match;\r\n      });\r\n    }\r\n    function cleanClauseTitle(value) {\r\n      return plain(value)\r\n        .replace(/\\s*[（(][^（）()]*[A-Za-z][^（）()]*[）)]/g, \"\")\r\n        .replace(/\\s*[（(][^（）()]*[A-Za-z].*$/g, \"\")\r\n        .trim();\r\n    }\r\n    function plain(value) { return String(value ?? \"\").trim(); }\r\n\r\n    function initPercentOptions() {\r\n      const percent = byId(\"natPercent\");\r\n      const limit = byId(\"natLimit\");\r\n      const addon = byId(\"addonPercent\");\r\n      for (let p = 10; p \u003c= 100; p += 10) {\r\n        percent.insertAdjacentHTML(\"beforeend\", `\u003coption value=\"${p}\"\u003e火險保額 ${p}%\u003c/option\u003e`);\r\n        limit.insertAdjacentHTML(\"beforeend\", `\u003coption value=\"${p}\"\u003e火險保額 ${p}%\u003c/option\u003e`);\r\n        addon.insertAdjacentHTML(\"beforeend\", `\u003coption value=\"${p}\"\u003e火險保額 ${p}%\u003c/option\u003e`);\r\n      }\r\n      percent.value = \"100\";\r\n      limit.value = \"100\";\r\n      addon.value = \"50\";\r\n    }\r\n\r\n    function percentSelectHtml(value = \"\") {\r\n      const selected = value || \"\";\r\n      let html = `\u003coption value=\"\" ${selected === \"\" ? \"selected\" : \"\"}\u003e依上方設定\u003c/option\u003e`;\r\n      for (let p = 10; p \u003c= 100; p += 10) {\r\n        html += `\u003coption value=\"${p}\" ${String(p) === String(selected) ? \"selected\" : \"\"}\u003e火險保額 ${p}%\u003c/option\u003e`;\r\n      }\r\n      return html;\r\n    }\r\n\r\n    function renderCovers() {\r\n      byId(\"covers\").innerHTML = defaultCovers.map((name, idx) =\u003e `\r\n        \u003ctr\u003e\r\n          \u003ctd style=\"text-align:center\"\u003e\u003cinput type=\"checkbox\" class=\"cover-on\" data-idx=\"${idx}\" ${idx === 0 ? \"checked\" : \"\"}\u003e\u003c/td\u003e\r\n          \u003ctd\u003e\u003cinput class=\"cover-name\" data-idx=\"${idx}\" value=\"${escapeHtml(name)}\"\u003e\u003c/td\u003e\r\n          \u003ctd\u003e\u003cselect class=\"cover-amount\" data-idx=\"${idx}\"\u003e${percentSelectHtml(\"\")}\u003c/select\u003e\u003c/td\u003e\r\n        \u003c/tr\u003e\r\n      `).join(\"\");\r\n    }\r\n\r\n    function addCover(name = \"\", amount = \"\") {\r\n      byId(\"covers\").insertAdjacentHTML(\"beforeend\", `\r\n        \u003ctr\u003e\r\n          \u003ctd style=\"text-align:center\"\u003e\u003cinput type=\"checkbox\" class=\"cover-on\" checked\u003e\u003c/td\u003e\r\n          \u003ctd\u003e\u003cinput class=\"cover-name\" value=\"${escapeHtml(name)}\" placeholder=\"自行輸入險種\"\u003e\u003c/td\u003e\r\n          \u003ctd\u003e\u003cselect class=\"cover-amount\"\u003e${percentSelectHtml(amount)}\u003c/select\u003e\u003c/td\u003e\r\n        \u003c/tr\u003e\r\n      `);\r\n    }\r\n\r\n    function locationTemplate(index, data = {}) {\r\n      const repairDisplay = byId(\"industry\").value === \"汽車業\" ? \"\" : \"display:none\";\r\n      return `\r\n        \u003cdiv class=\"location-block\" data-location\u003e\r\n          \u003cdiv class=\"location-head\"\u003e\r\n            \u003cspan\u003e標的物 ${index + 1}\u003c/span\u003e\r\n            \u003cbutton class=\"btn danger remove-location\" type=\"button\"\u003e刪除\u003c/button\u003e\r\n          \u003c/div\u003e\r\n          \u003cdiv class=\"location-body\"\u003e\r\n            \u003cdiv class=\"grid\"\u003e\r\n              \u003clabel class=\"field\"\u003e名稱 / 代號\r\n                \u003cinput data-field=\"siteName\" value=\"${escapeHtml(data.siteName || \"\")}\" placeholder=\"例：服務廠A\"\u003e\r\n              \u003c/label\u003e\r\n              \u003clabel class=\"field repair-field\" style=\"${repairDisplay}\"\u003e是否有修理廠\r\n                \u003cselect data-field=\"repairShop\"\u003e\r\n                  \u003coption ${data.repairShop !== \"是\" ? \"selected\" : \"\"}\u003e否\u003c/option\u003e\r\n                  \u003coption ${data.repairShop === \"是\" ? \"selected\" : \"\"}\u003e是\u003c/option\u003e\r\n                \u003c/select\u003e\r\n              \u003c/label\u003e\r\n              \u003clabel class=\"field wide\"\u003e標的物地址\r\n                \u003cinput data-field=\"address\" value=\"${escapeHtml(data.address || \"\")}\"\u003e\r\n              \u003c/label\u003e\r\n              \u003clabel class=\"field\"\u003e使用性質\r\n                \u003cinput data-field=\"usageNature\" value=\"${escapeHtml(data.usageNature || \"\")}\" placeholder=\"例：辦公室、堆棧、倉庫\"\u003e\r\n              \u003c/label\u003e\r\n              \u003clabel class=\"field wide\"\u003e建築結構\u003c/label\u003e\r\n              \u003ctextarea class=\"wide\" data-field=\"structure\" placeholder=\"手寫內容可打在這裡\"\u003e${escapeHtml(data.structure || \"\")}\u003c/textarea\u003e\r\n            \u003c/div\u003e\r\n            \u003cdiv class=\"money-grid\" style=\"margin-top:10px\"\u003e\r\n              ${moneyFields.map(field =\u003e {\r\n                const label = fieldMeta[field].label;\r\n                return `\u003clabel class=\"field\"\u003e${label}\u003cinput data-field=\"${field}\" value=\"${escapeHtml(data[field] || \"\")}\" placeholder=\"保額\"\u003e\u003c/label\u003e`;\r\n              }).join(\"\")}\r\n            \u003c/div\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n      `;\r\n    }\r\n\r\n    function addLocation(data = {}) {\r\n      const box = byId(\"locations\");\r\n      box.insertAdjacentHTML(\"beforeend\", locationTemplate(box.querySelectorAll(\"[data-location]\").length, data));\r\n      updateLocationNumbers();\r\n      syncIndustryFields();\r\n    }\r\n\r\n    function updateLocationNumbers() {\r\n      byId(\"locations\").querySelectorAll(\"[data-location]\").forEach((block, idx) =\u003e {\r\n        block.querySelector(\".location-head span\").textContent = `標的物 ${idx + 1}`;\r\n      });\r\n    }\r\n\r\n    function syncIndustryFields() {\r\n      const show = byId(\"industry\").value === \"汽車業\";\r\n      document.querySelectorAll(\".repair-field\").forEach(el =\u003e el.style.display = show ? \"\" : \"none\");\r\n    }\r\n\r\n    function readLocations() {\r\n      return [...byId(\"locations\").querySelectorAll(\"[data-location]\")].map(block =\u003e {\r\n        const obj = {};\r\n        block.querySelectorAll(\"[data-field]\").forEach(input =\u003e obj[input.dataset.field] = input.value);\r\n        return obj;\r\n      });\r\n    }\r\n\r\n    function detectIncludedFields(text, sourceField) {\r\n      const sourceLabel = fieldMeta[sourceField].label;\r\n      const matches = [...plain(text).matchAll(/[（(]([^（）()]*)[）)]/g)];\r\n      const hits = [];\r\n      for (const match of matches) {\r\n        const content = match[1];\r\n        if (!content.includes(\"含\")) continue;\r\n        for (const field of moneyFields) {\r\n          if (field === sourceField) continue;\r\n          if (fieldMeta[field].aliases.some(alias =\u003e content.includes(alias))) {\r\n            hits.push({ field, key: fieldMeta[field].key, note: `含於${sourceLabel}` });\n          }\r\n        }\r\n      }\r\n      return hits;\r\n    }\r\n\r\n    function inclusionNotes(loc) {\r\n      const notes = {};\r\n      for (const field of moneyFields) notes[field] = [];\r\n      for (const sourceField of moneyFields) {\r\n        if (moneyValue(loc[sourceField]) \u003c= 0) continue;\r\n        for (const hit of detectIncludedFields(loc[sourceField], sourceField)) {\r\n          if (!notes[hit.field].includes(hit.note)) notes[hit.field].push(hit.note);\r\n        }\r\n      }\r\n      return notes;\r\n    }\r\n\r\n    function displayPropertyCell(loc, field) {\r\n      const amount = fieldAmountText(loc[field]);\r\n      const notes = inclusionNotes(loc)[field] || [];\r\n      if (amount \u0026\u0026 notes.length) return `${amount}\u003cbr\u003e\u003csmall\u003e${notes.map(escapeHtml).join(\"\u003cbr\u003e\")}\u003c/small\u003e`;\r\n      if (amount) return amount;\r\n      return notes.map(escapeHtml).join(\"\u003cbr\u003e\");\r\n    }\r\n\r\n    function selectedPropertyKeys(locations = readLocations()) {\r\n      const active = new Set();\r\n      for (const loc of locations) {\r\n        for (const item of propertyMap) {\r\n          if (moneyValue(loc[item.field]) \u003e 0) active.add(item.key);\r\n        }\r\n        for (const sourceField of moneyFields) {\r\n          for (const hit of detectIncludedFields(loc[sourceField], sourceField)) {\r\n            active.add(hit.key);\r\n          }\r\n        }\r\n      }\r\n      return active;\r\n    }\r\n\r\n    function renderClauseSelector(mode = \"recommend\") {\r\n      const active = selectedPropertyKeys();\r\n      const shouldCheck = clause =\u003e {\r\n        if (mode === \"all\") return true;\r\n        if (mode === \"none\") return false;\r\n        return propertyMap.some(item =\u003e active.has(item.key) \u0026\u0026 clause[item.key]);\r\n      };\r\n      byId(\"clauseBox\").innerHTML = SB_CLAUSES.map(clause =\u003e `\r\n        \u003clabel class=\"clause-row\"\u003e\r\n          \u003cinput type=\"checkbox\" class=\"clause-check\" value=\"${escapeHtml(clause.code)}\" ${shouldCheck(clause) ? \"checked\" : \"\"}\u003e\r\n          \u003cspan\u003e${escapeHtml(clause.code)}\u003c/span\u003e\r\n          \u003cspan\u003e${escapeHtml(cleanClauseTitle(clause.title))}\u003c/span\u003e\r\n        \u003c/label\u003e\r\n      `).join(\"\");\r\n    }\r\n\r\n    function readCovers() {\r\n      return [...document.querySelectorAll(\"#covers tr\")].map(row =\u003e {\r\n        return {\r\n          on: row.querySelector(\".cover-on\").checked,\r\n          name: plain(row.querySelector(\".cover-name\").value),\r\n          amount: plain(row.querySelector(\".cover-amount\").value)\r\n        };\r\n      }).filter(c =\u003e c.on \u0026\u0026 c.name);\r\n    }\r\n\r\n    function selectedClauses() {\r\n      const selected = new Set([...document.querySelectorAll(\".clause-check:checked\")].map(el =\u003e el.value));\r\n      const standardClauses = SB_CLAUSES.filter(c =\u003e selected.has(c.code));\r\n      const customClauses = [...document.querySelectorAll(\".custom-clause-input\")]\r\n        .map(input =\u003e plain(input.value))\r\n        .filter(Boolean)\r\n        .map(title =\u003e ({ title }));\r\n      return standardClauses.concat(customClauses);\r\n    }\r\n\r\n    function addCustomClause(value = \"\") {\r\n      byId(\"customClauseBox\").insertAdjacentHTML(\"beforeend\", `\r\n        \u003cdiv class=\"custom-clause-row\" style=\"display:grid;grid-template-columns:1fr 52px;gap:8px;margin-top:8px\"\u003e\r\n          \u003cinput class=\"custom-clause-input\" value=\"${escapeHtml(value)}\" placeholder=\"輸入自訂附加條款名稱\"\u003e\r\n          \u003cbutton class=\"btn danger remove-custom-clause\" type=\"button\"\u003eX\u003c/button\u003e\r\n        \u003c/div\u003e\r\n      `);\r\n    }\r\n\r\n    function isNaturalDisasterCover(name) {\r\n      return name.includes(\"颱風\") || name.includes(\"洪水\") || name.includes(\"地震\");\r\n    }\r\n\r\n    function otherAddonRows(covers, total, addonPercent) {\r\n      const others = covers.filter(c =\u003e !isNaturalDisasterCover(c.name));\r\n      if (!others.length) return `\u003ctr\u003e\u003ctd style=\"font-weight:700\"\u003e其他附加險比例\u003c/td\u003e\u003ctd\u003e火險保額 ${addonPercent}%：${fmtMoney(total * Number(addonPercent) / 100)}\u003c/td\u003e\u003c/tr\u003e`;\r\n      const hasDifferent = others.some(c =\u003e c.amount \u0026\u0026 String(c.amount) !== String(addonPercent));\r\n      if (!hasDifferent) {\r\n        return `\u003ctr\u003e\u003ctd style=\"font-weight:700\"\u003e其他附加險比例\u003c/td\u003e\u003ctd\u003e火險保額 ${addonPercent}%：${fmtMoney(total * Number(addonPercent) / 100)}\u003c/td\u003e\u003c/tr\u003e`;\r\n      }\r\n      const groups = new Map();\r\n      for (const cover of others) {\r\n        const percent = cover.amount || addonPercent;\r\n        if (!groups.has(percent)) groups.set(percent, []);\r\n        groups.get(percent).push(cover.name);\r\n      }\r\n      const sortedGroups = [...groups.entries()].sort((a, b) =\u003e {\r\n        if (b[1].length !== a[1].length) return b[1].length - a[1].length;\r\n        if (String(a[0]) === String(addonPercent)) return -1;\r\n        if (String(b[0]) === String(addonPercent)) return 1;\r\n        return Number(b[0]) - Number(a[0]);\r\n      });\r\n      const [mainPercent, mainNames] = sortedGroups[0];\r\n      const exceptionNames = sortedGroups.slice(1).flatMap(([, names]) =\u003e names);\r\n      const exceptionRows = sortedGroups.slice(1).map(([percent, names]) =\u003e {\r\n        const amount = Math.round(total * Number(percent) / 100);\r\n        return `\u003ctr\u003e\u003ctd style=\"font-weight:700\"\u003e${escapeHtml(names.join(\"、\"))}\u003c/td\u003e\u003ctd\u003e火險保額 ${percent}%：${fmtMoney(amount)}\u003c/td\u003e\u003c/tr\u003e`;\r\n      }).join(\"\");\r\n      const mainAmount = Math.round(total * Number(mainPercent) / 100);\r\n      const mainLabel = exceptionNames.length\r\n        ? `除${escapeHtml(exceptionNames.join(\"、\"))}外，其餘附加險種`\r\n        : \"其餘附加險種\";\r\n      return exceptionRows + `\u003ctr\u003e\u003ctd style=\"font-weight:700\"\u003e${mainLabel}\u003c/td\u003e\u003ctd\u003e火險保額 ${mainPercent}%：${fmtMoney(mainAmount)}\u003c/td\u003e\u003c/tr\u003e`;\r\n    }\r\n\r\n    function totalFireAmount(locations) {\r\n      return locations.reduce((sum, loc) =\u003e sum + locationSubtotal(loc), 0);\r\n    }\r\n\r\n    function locationSubtotal(loc) {\r\n      return moneyFields.reduce((s, f) =\u003e s + moneyValue(loc[f]), 0);\r\n    }\r\n\r\n    function renderQuote() {\r\n      const locations = readLocations();\r\n      const covers = readCovers();\r\n      const clauses = selectedClauses();\r\n      const total = totalFireAmount(locations);\r\n      const industry = plain(byId(\"industry\").value);\r\n      const now = new Date();\r\n      const dateText = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,\"0\")}/${String(now.getDate()).padStart(2,\"0\")}`;\r\n      const natPercent = byId(\"natPercent\").value;\r\n      const natLimit = byId(\"natLimit\").value;\r\n      const addonPercent = byId(\"addonPercent\").value;\r\n      const natAmount = Math.round(total * Number(natPercent) / 100);\r\n      const limitAmount = Math.round(total * Number(natLimit) / 100);\r\n      const repairCol = industry === \"汽車業\" ? `\u003cth\u003e是否有修理廠\u003c/th\u003e` : \"\";\r\n      const addonRows = otherAddonRows(covers, total, addonPercent);\r\n\r\n      const subjectRows = locations.map((loc, idx) =\u003e `\r\n        \u003ctr\u003e\r\n          \u003ctd\u003e${idx + 1}\u003c/td\u003e\r\n          \u003ctd\u003e${escapeHtml(loc.siteName || \"\")}\u003c/td\u003e\r\n          \u003ctd\u003e${escapeHtml(loc.address || \"\")}\u003c/td\u003e\r\n          \u003ctd\u003e${escapeHtml(loc.usageNature || \"\")}\u003c/td\u003e\r\n          \u003ctd style=\"text-align:right\"\u003e${displayPropertyCell(loc, \"building\")}\u003c/td\u003e\r\n          \u003ctd style=\"text-align:right\"\u003e${displayPropertyCell(loc, \"decoration\")}\u003c/td\u003e\r\n          \u003ctd style=\"text-align:right\"\u003e${displayPropertyCell(loc, \"machinery\")}\u003c/td\u003e\r\n          \u003ctd style=\"text-align:right\"\u003e${displayPropertyCell(loc, \"equipment\")}\u003c/td\u003e\r\n          \u003ctd style=\"text-align:right\"\u003e${displayPropertyCell(loc, \"goods\")}\u003c/td\u003e\r\n          ${industry === \"汽車業\" ? `\u003ctd\u003e${escapeHtml(loc.repairShop || \"否\")}\u003c/td\u003e` : \"\"}\r\n          \u003ctd style=\"text-align:right;font-weight:700\"\u003e${fmtMoney(locationSubtotal(loc))}\u003c/td\u003e\r\n          \u003ctd\u003e${escapeHtml(loc.structure || \"\")}\u003c/td\u003e\r\n        \u003c/tr\u003e\r\n      `).join(\"\");\r\n\r\n      byId(\"quotePreview\").innerHTML = `\r\n        \u003cdiv class=\"quote-title\"\u003e\r\n          \u003cdiv\u003e\r\n            \u003ch2\u003e商業火災保險報價單\u003c/h2\u003e\r\n          \u003c/div\u003e\r\n          \u003cdiv class=\"meta\"\u003e\r\n            \u003cdiv\u003e製表日期：${dateText}\u003c/div\u003e\r\n            \u003cdiv\u003e產業別：${escapeHtml(industry)}\u003c/div\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003ch3\u003e被保險人資訊\u003c/h3\u003e\r\n        \u003cdiv class=\"info-grid\"\u003e\r\n          \u003cdiv class=\"info-label\"\u003e公司名稱\u003c/div\u003e\u003cdiv\u003e${escapeHtml(byId(\"companyName\").value)}\u003c/div\u003e\r\n          \u003cdiv class=\"info-label\"\u003e統一編號\u003c/div\u003e\u003cdiv\u003e${escapeHtml(byId(\"taxId\").value)}\u003c/div\u003e\r\n          \u003cdiv class=\"info-label\"\u003e代表人\u003c/div\u003e\u003cdiv\u003e${escapeHtml(byId(\"representative\").value)}\u003c/div\u003e\n          \u003cdiv class=\"info-label\"\u003e電話\u003c/div\u003e\u003cdiv\u003e${escapeHtml(byId(\"phone\").value)}\u003c/div\u003e\n          \u003cdiv class=\"info-label\"\u003e通訊地址\u003c/div\u003e\u003cdiv style=\"grid-column: span 3\"\u003e${escapeHtml(byId(\"mailingAddress\").value)}\u003c/div\u003e\n          \u003cdiv class=\"info-label\"\u003e保險期間\u003c/div\u003e\u003cdiv style=\"grid-column: span 3\"\u003e${escapeHtml(byId(\"insurancePeriod\").value)}\u003c/div\u003e\n        \u003c/div\u003e\n\r\n        \u003ch3\u003e本保險契約所承保之危險事故\u003c/h3\u003e\r\n        \u003ctable\u003e\r\n          \u003ctbody\u003e\r\n            \u003ctr\u003e\u003ctd\u003e火災\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd\u003e爆炸引起之火災\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd\u003e閃電雷擊\u003c/td\u003e\u003c/tr\u003e\r\n          \u003c/tbody\u003e\r\n        \u003c/table\u003e\r\n\r\n        \u003ch3\u003e標的物與保額\u003c/h3\u003e\r\n        \u003ctable\u003e\r\n          \u003cthead\u003e\r\n            \u003ctr\u003e\r\n              \u003cth style=\"width:38px\"\u003e#\u003c/th\u003e\u003cth\u003e名稱\u003c/th\u003e\u003cth\u003e標的物地址\u003c/th\u003e\u003cth\u003e使用性質\u003c/th\u003e\r\n              \u003cth\u003e建築物\u003c/th\u003e\u003cth\u003e營業裝修\u003c/th\u003e\u003cth\u003e機器設備\u003c/th\u003e\u003cth\u003e營業生財\u003c/th\u003e\u003cth\u003e貨物\u003c/th\u003e${repairCol}\u003cth\u003e小計\u003c/th\u003e\u003cth\u003e建築結構\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/thead\u003e\r\n          \u003ctbody\u003e${subjectRows || `\u003ctr\u003e\u003ctd colspan=\"${industry === \"汽車業\" ? 12 : 11}\"\u003e尚未輸入標的物\u003c/td\u003e\u003c/tr\u003e`}\u003c/tbody\u003e\r\n          \u003ctfoot\u003e\u003ctr\u003e\u003ctd colspan=\"${industry === \"汽車業\" ? 11 : 10}\" style=\"text-align:right;font-weight:700\"\u003e火險總保額\u003c/td\u003e\u003ctd style=\"font-weight:700;text-align:right\"\u003e${fmtMoney(total)}\u003c/td\u003e\u003c/tr\u003e\u003c/tfoot\u003e\r\n        \u003c/table\u003e\r\n\r\n        \u003ch3\u003e自負額\u003c/h3\u003e\r\n        \u003ctable\u003e\r\n          \u003ctbody\u003e\r\n            \u003ctr\u003e\u003ctd\u003e${escapeHtml(byId(\"deductible\").value).replace(/\\n/g, \"\u003cbr\u003e\")}\u003c/td\u003e\u003c/tr\u003e\r\n          \u003c/tbody\u003e\r\n        \u003c/table\u003e\r\n\r\n        \u003ch3\u003e天災保額\u003c/h3\u003e\r\n        \u003ctable\u003e\r\n          \u003ctbody\u003e\r\n            \u003ctr\u003e\u003ctd\u003e火險保額 ${natPercent}%：${fmtMoney(natAmount)}\u003c/td\u003e\u003c/tr\u003e\r\n          \u003c/tbody\u003e\r\n        \u003c/table\u003e\r\n\r\n        \u003ch3\u003e天災限額\u003c/h3\u003e\r\n        \u003ctable\u003e\r\n          \u003ctbody\u003e\r\n            \u003ctr\u003e\u003ctd\u003e火險保額 ${natLimit}%：${fmtMoney(limitAmount)}\u003c/td\u003e\u003c/tr\u003e\r\n          \u003c/tbody\u003e\r\n        \u003c/table\u003e\r\n\r\n        \u003ch3\u003e附加險\u003c/h3\u003e\r\n        \u003ctable\u003e\r\n          \u003ctbody\u003e\r\n            ${addonRows}\r\n          \u003c/tbody\u003e\r\n        \u003c/table\u003e\r\n\r\n        \u003ch3\u003e備註\u003c/h3\u003e\r\n        \u003ctable\u003e\r\n          \u003ctbody\u003e\r\n            \u003ctr\u003e\u003ctd\u003e${escapeHtml(byId(\"remarks\").value).replace(/\\n/g, \"\u003cbr\u003e\")}\u003c/td\u003e\u003c/tr\u003e\r\n          \u003c/tbody\u003e\r\n        \u003c/table\u003e\r\n\r\n        \u003ch3\u003eSB 附加條款\u003c/h3\u003e\r\n        \u003col class=\"terms-list\"\u003e\r\n          ${clauses.map(c =\u003e `\u003cli\u003e${escapeHtml(cleanClauseTitle(c.title))}\u003c/li\u003e`).join(\"\") || \"\u003cli\u003e尚未選擇附加條款\u003c/li\u003e\"}\r\n        \u003c/ol\u003e\r\n      `;\r\n      byId(\"saveStatus\").textContent = \"已產生\";\r\n    }\r\n\r\n    function generateQuote() {\r\n      if (!document.querySelector(\".clause-check:checked\")) {\r\n        renderClauseSelector(\"recommend\");\r\n      }\r\n      renderQuote();\r\n    }\r\n\r\n    function fillSample() {\r\n      byId(\"industry\").value = \"汽車業\";\r\n      byId(\"companyName\").value = \"範例汽車服務股份有限公司\";\r\n      byId(\"taxId\").value = \"00000000\";\r\n      byId(\"representative\").value = \"王小明\";\n      byId(\"phone\").value = \"02-0000-0000\";\n      byId(\"mailingAddress\").value = \"臺北市範例區測試路100號\";\n      byId(\"insurancePeriod\").value = \"2026/07/01 中午12時起至 2027/07/01 中午12時止\";\n      byId(\"locations\").innerHTML = \"\";\n      addLocation({\r\n        siteName: \"範例-服務廠A\",\r\n        address: \"臺北市範例區測試路100號1樓及2樓\",\r\n        usageNature: \"辦公室及維修服務區\",\r\n        decoration: \"35000000\",\r\n        equipment: \"400000\",\r\n        goods: \"16000000\",\r\n        repairShop: \"是\",\r\n        structure: \"鋼筋混凝土造平屋頂地上5層樓地下1層樓 特二等建築\"\r\n      });\r\n      addLocation({\r\n        siteName: \"範例-服務廠B\",\r\n        address: \"臺北市範例區示範街200號(全棟)\",\r\n        usageNature: \"倉庫\",\r\n        decoration: \"38000000\",\r\n        machinery: \"1100000\",\r\n        goods: \"17500000\",\r\n        repairShop: \"是\",\r\n        structure: \"鋼骨造鐵皮屋頂地上3層樓地下1層樓 頭等建築\"\r\n      });\r\n      byId(\"remarks\").value = \"本保單颱風及洪水險對於室外廣告設備及招牌所遭受之損失及滅失，亦負賠償責任。\";\r\n      document.querySelectorAll(\".cover-on\").forEach(el =\u003e el.checked = true);\r\n      renderClauseSelector(\"recommend\");\r\n      renderQuote();\r\n    }\r\n\r\n    function clearAll() {\r\n      [\"companyName\", \"taxId\", \"representative\", \"phone\", \"mailingAddress\", \"insurancePeriod\", \"remarks\"].forEach(id =\u003e byId(id).value = \"\");\n      byId(\"locations\").innerHTML = \"\";\r\n      addLocation();\r\n      document.querySelectorAll(\".cover-on\").forEach((el, idx) =\u003e el.checked = idx === 0);\r\n      document.querySelectorAll(\".cover-amount\").forEach(el =\u003e el.value = \"\");\r\n      renderClauseSelector(\"none\");\r\n      byId(\"customClauseBox\").innerHTML = \"\";\r\n      byId(\"quotePreview\").innerHTML = `\u003cdiv class=\"empty\"\u003e填完左側資料後，按「產生報價單」。\u003c/div\u003e`;\r\n      byId(\"saveStatus\").textContent = \"已清空\";\r\n    }\r\n\r\n    document.addEventListener(\"click\", e =\u003e {\r\n      if (e.target.matches(\".remove-location\")) {\r\n        e.target.closest(\"[data-location]\").remove();\r\n        updateLocationNumbers();\r\n      }\r\n      if (e.target.matches(\".remove-custom-clause\")) {\r\n        e.target.closest(\".custom-clause-row\").remove();\r\n      }\r\n    });\r\n    byId(\"industry\").addEventListener(\"change\", syncIndustryFields);\r\n    byId(\"addLocationBtn\").addEventListener(\"click\", () =\u003e addLocation());\r\n    byId(\"addCoverBtn\").addEventListener(\"click\", () =\u003e addCover());\r\n    byId(\"addCustomClauseBtn\").addEventListener(\"click\", () =\u003e addCustomClause());\r\n    byId(\"recommendBtn\").addEventListener(\"click\", () =\u003e renderClauseSelector(\"recommend\"));\r\n    byId(\"selectAllClausesBtn\").addEventListener(\"click\", () =\u003e renderClauseSelector(\"all\"));\r\n    byId(\"clearClausesBtn\").addEventListener(\"click\", () =\u003e renderClauseSelector(\"none\"));\r\n    byId(\"generateBtn\").addEventListener(\"click\", generateQuote);\r\n    byId(\"printBtn\").addEventListener(\"click\", () =\u003e { generateQuote(); window.print(); });\r\n    byId(\"sampleBtn\").addEventListener(\"click\", fillSample);\r\n    byId(\"clearBtn\").addEventListener(\"click\", clearAll);\r\n\r\n    initPercentOptions();\r\n    renderCovers();\r\n    addLocation();\r\n    renderClauseSelector(\"none\");\r\n  \u003c/script\u003e\r\n\u003c/body\u003e\r\n\u003c/html\u003e\r\n" },
      liability: { title: "公共意外險", html: "\u003c!doctype html\u003e\n\u003chtml lang=\"zh-Hant\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n  \u003ctitle\u003e處所公共意外責任保險報價單系統\u003c/title\u003e\n  \u003cstyle\u003e\n    :root {\n      --ink: #172438;\n      --muted: #5e6b78;\n      --line: #cbd7e2;\n      --head: #15324d;\n      --head-2: #2f5f7c;\n      --paper: #fff;\n      --soft: #eef5f9;\n      --field: #fff8e3;\n      --yellow: #fff200;\n      --danger: #b42318;\n      --ok: #2f7d32;\n    }\n    * { box-sizing: border-box; }\n    body {\n      margin: 0;\n      font-family: \"Microsoft JhengHei\", \"Noto Sans TC\", Arial, sans-serif;\n      color: var(--ink);\n      background: #f4f7fa;\n      line-height: 1.45;\n    }\n    button, input, select, textarea { font: inherit; }\n    .topbar {\n      background: var(--head);\n      color: #fff;\n      padding: 16px 22px 14px;\n      border-bottom: 4px solid #5e9fc0;\n    }\n    .topbar h1 { margin: 0; font-size: 26px; letter-spacing: 0; }\n    .topbar p { margin: 5px 0 0; color: #dbeaf2; font-size: 14px; }\n    .app {\n      display: grid;\n      grid-template-columns: minmax(430px, 540px) minmax(760px, 1fr);\n      gap: 18px;\n      padding: 18px;\n      align-items: start;\n    }\n    .panel, .preview-shell {\n      background: var(--paper);\n      border: 1px solid var(--line);\n      border-radius: 8px;\n      overflow: hidden;\n    }\n    .panel-header {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 10px;\n      padding: 10px 14px;\n      background: var(--head-2);\n      color: #fff;\n      font-weight: 700;\n    }\n    .panel-body { padding: 14px; }\n    .section-title {\n      margin: 18px 0 8px;\n      padding: 7px 10px;\n      background: var(--soft);\n      border-left: 4px solid var(--head-2);\n      font-weight: 700;\n    }\n    .grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 10px;\n    }\n    .field {\n      display: grid;\n      gap: 4px;\n      color: var(--muted);\n      font-size: 13px;\n    }\n    .field.wide { grid-column: 1 / -1; }\n    input, select, textarea {\n      width: 100%;\n      min-width: 0;\n      border: 1px solid #9fb4c8;\n      border-radius: 6px;\n      background: var(--field);\n      color: var(--ink);\n      padding: 8px 9px;\n      min-height: 38px;\n    }\n    input:focus, select:focus, textarea:focus {\n      outline: 2px solid #69a9c9;\n      outline-offset: 1px;\n    }\n    textarea { resize: vertical; min-height: 74px; }\n    .btn {\n      border: 1px solid #9fb4c8;\n      background: #fff;\n      color: var(--ink);\n      border-radius: 6px;\n      padding: 8px 12px;\n      cursor: pointer;\n      font-weight: 700;\n    }\n    .btn.primary { background: var(--head); border-color: var(--head); color: #fff; }\n    .btn.good { background: var(--ok); border-color: var(--ok); color: #fff; }\n    .btn.danger { color: var(--danger); }\n    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }\n    .location-block {\n      border: 1px solid var(--line);\n      border-radius: 8px;\n      margin-top: 10px;\n      overflow: hidden;\n      background: #fff;\n    }\n    .location-head {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      gap: 10px;\n      padding: 8px 10px;\n      background: #f0f5f9;\n      font-weight: 700;\n    }\n    .location-body { padding: 10px; }\n    .mini-note { color: var(--muted); font-size: 13px; margin: 7px 0 0; }\n    .input-table { width: 100%; border-collapse: collapse; }\n    .input-table th, .input-table td {\n      border: 1px solid var(--line);\n      padding: 7px;\n      vertical-align: middle;\n    }\n    .input-table th { background: var(--head-2); color: #fff; }\n    .quote {\n      background: #fff;\n      min-height: 960px;\n      padding: 24px;\n      overflow: auto;\n    }\n    .quote-title {\n      display: flex;\n      justify-content: space-between;\n      align-items: end;\n      gap: 16px;\n      border-bottom: 3px solid var(--head);\n      padding-bottom: 10px;\n      margin-bottom: 12px;\n    }\n    .quote-title h2 { margin: 0; font-size: 28px; letter-spacing: 0; }\n    .meta { text-align: right; color: var(--muted); font-size: 13px; }\n    .quote h3 {\n      margin: 10px 0 4px;\n      padding: 3px 6px;\n      background: var(--yellow);\n      color: #000;\n      font-size: 14px;\n    }\n    .quote table {\n      width: 100%;\n      border-collapse: collapse;\n      table-layout: fixed;\n      margin-bottom: 8px;\n      font-size: 12px;\n    }\n    .quote th, .quote td {\n      border: 1px solid #d7e0e8;\n      padding: 4px 6px;\n      vertical-align: top;\n      overflow-wrap: anywhere;\n    }\n    .quote th { background: var(--yellow); color: #000; font-weight: 700; border-color: #d8d15f; }\n    .quote td { border-color: #d7dee6; }\n    .info-grid {\n      display: grid;\n      grid-template-columns: 130px 1fr 130px 1fr;\n      border: 1px solid #d7e0e8;\n      border-bottom: 0;\n    }\n    .info-grid \u003e div { border-bottom: 1px solid #d7e0e8; padding: 7px 8px; }\n    .info-label { background: #f4f8fb; font-weight: 700; }\n    .limit-row td:nth-child(2) { color: #d12a1f; font-weight: 700; text-align: center; }\n    .empty { color: var(--muted); padding: 40px; text-align: center; border: 1px dashed var(--line); }\n    .check-row {\n      display: grid;\n      grid-template-columns: 34px 1fr;\n      align-items: center;\n      gap: 6px;\n      border: 1px solid var(--line);\n      padding: 7px 9px;\n      margin-bottom: 6px;\n      border-radius: 7px;\n    }\n    .check-row input { min-height: auto; }\n    @media (max-width: 1100px) {\n      .app { grid-template-columns: 1fr; }\n      .quote { padding: 18px; }\n    }\n    @media print {\n      body { background: #fff; }\n      .topbar, .panel, .panel-header .print-only-hide { display: none !important; }\n      .app { display: block; padding: 0; }\n      .preview-shell { border: 0; border-radius: 0; }\n      .panel-header { display: none; }\n      .quote { padding: 0; overflow: visible; }\n      .quote-title h2 { font-size: 26px; }\n      @page { size: A4 landscape; margin: 10mm; }\n    }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cheader class=\"topbar\"\u003e\n    \u003ch1\u003e處所公共意外責任保險報價單系統\u003c/h1\u003e\n    \u003cp\u003e輸入被保險人、處所資訊與報價額度，產生可列印成 PDF 的公共意外險報價單。\u003c/p\u003e\n  \u003c/header\u003e\n\n  \u003cmain class=\"app\"\u003e\n    \u003csection class=\"panel\"\u003e\n      \u003cdiv class=\"panel-header\"\u003e\n        \u003cspan\u003eINPUT：報價資料\u003c/span\u003e\n        \u003cspan id=\"saveStatus\"\u003e尚未產生\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"panel-body\"\u003e\n        \u003cdiv class=\"toolbar\"\u003e\n          \u003cbutton class=\"btn\" id=\"sampleBtn\" type=\"button\"\u003e帶入範例\u003c/button\u003e\n          \u003cbutton class=\"btn danger\" id=\"clearBtn\" type=\"button\"\u003e清空\u003c/button\u003e\n          \u003cbutton class=\"btn primary\" id=\"generateBtn\" type=\"button\"\u003e產生報價單\u003c/button\u003e\n          \u003cbutton class=\"btn good\" id=\"printBtn\" type=\"button\"\u003e列印 / 存成 PDF\u003c/button\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section-title\"\u003e被保險人資訊\u003c/div\u003e\n        \u003cdiv class=\"grid\"\u003e\n          \u003clabel class=\"field\"\u003e公司名稱\n            \u003cinput id=\"companyName\"\u003e\n          \u003c/label\u003e\n          \u003clabel class=\"field\"\u003e統一編號\n            \u003cinput id=\"taxId\"\u003e\n          \u003c/label\u003e\n          \u003clabel class=\"field\"\u003e代表人\n            \u003cinput id=\"representative\"\u003e\n          \u003c/label\u003e\n          \u003clabel class=\"field\"\u003e電話\n            \u003cinput id=\"phone\"\u003e\n          \u003c/label\u003e\n          \u003clabel class=\"field wide\"\u003e通訊地址\n            \u003cinput id=\"mailingAddress\"\u003e\n          \u003c/label\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section-title\"\u003e公共意外險處所資料\u003c/div\u003e\n        \u003cdiv id=\"locations\"\u003e\u003c/div\u003e\n        \u003cbutton class=\"btn\" id=\"addLocationBtn\" type=\"button\" style=\"margin-top:8px\"\u003e新增處所\u003c/button\u003e\n        \u003cp class=\"mini-note\"\u003e每個處所可填坪數、使用性質、招牌、電梯、烤漆爐、修理廠、樓層與消防設備。\u003c/p\u003e\n\n        \u003cdiv class=\"section-title\"\u003e報價額度\u003c/div\u003e\n        \u003cdiv class=\"grid\"\u003e\n          \u003clabel class=\"field\"\u003e每一人體傷\n            \u003cinput id=\"limitPersonInjury\" placeholder=\"例：600萬\"\u003e\n          \u003c/label\u003e\n          \u003clabel class=\"field\"\u003e每一事故體傷\n            \u003cinput id=\"limitAccidentInjury\" placeholder=\"例：3000萬\"\u003e\n          \u003c/label\u003e\n          \u003clabel class=\"field\"\u003e每一事故財損\n            \u003cinput id=\"limitPropertyDamage\" placeholder=\"例：500萬\"\u003e\n          \u003c/label\u003e\n          \u003clabel class=\"field\"\u003e最高賠償限額\n            \u003cinput id=\"limitAggregate\" placeholder=\"例：7000萬\"\u003e\n          \u003c/label\u003e\n          \u003clabel class=\"field\"\u003e自負額\n            \u003cinput id=\"deductible\" placeholder=\"例：5000\"\u003e\n          \u003c/label\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section-title\"\u003e附加條款\u003c/div\u003e\n        \u003cdiv id=\"clauses\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"toolbar\"\u003e\n          \u003cbutton class=\"btn\" id=\"selectAllClausesBtn\" type=\"button\"\u003e全選\u003c/button\u003e\n          \u003cbutton class=\"btn\" id=\"clearClausesBtn\" type=\"button\"\u003e清空條款\u003c/button\u003e\n          \u003cbutton class=\"btn\" id=\"addCustomClauseBtn\" type=\"button\"\u003e新增自訂條款\u003c/button\u003e\n        \u003c/div\u003e\n        \u003cdiv id=\"customClauses\"\u003e\u003c/div\u003e\n\n        \u003cdiv class=\"section-title\"\u003e備註\u003c/div\u003e\n        \u003clabel class=\"field wide\"\u003e備註\n          \u003ctextarea id=\"remarks\" placeholder=\"可輸入核保備註或特殊約定\"\u003e\u003c/textarea\u003e\n        \u003c/label\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"preview-shell\"\u003e\n      \u003cdiv class=\"panel-header\"\u003e\n        \u003cspan\u003eOUTPUT：報價單預覽\u003c/span\u003e\n        \u003cspan class=\"print-only-hide\"\u003e可列印成 PDF\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"quote\" id=\"quotePreview\"\u003e\n        \u003cdiv class=\"empty\"\u003e填完左側資料後，按「產生報價單」。\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n  \u003c/main\u003e\n\n  \u003cscript\u003e\n    const DEFAULT_CLAUSES = [\n      \"公共意外責任保險電梯責任附加條款\",\n      \"公共意外責任保險停車場責任附加條款\",\n      \"公共意外責任保險汽車修理廠責任附加條款\",\n      \"公共意外責任保險食物中毒附加條款\",\n      \"公共意外招牌責任附加條款\"\n    ];\n\n    const yesNo = [\"有\", \"無\"];\n\n    function byId(id) {\n      return document.getElementById(id);\n    }\n\n    function escapeHtml(value) {\n      return String(value ?? \"\").replace(/[\u0026\u003c\u003e\"\u0027]/g, ch =\u003e ({\n        \"\u0026\": \"\u0026amp;\",\n        \"\u003c\": \"\u0026lt;\",\n        \"\u003e\": \"\u0026gt;\",\n        \u0027\"\u0027: \"\u0026quot;\",\n        \"\u0027\": \"\u0026#039;\"\n      }[ch]));\n    }\n\n    function plain(value) {\n      return String(value ?? \"\").trim();\n    }\n\n    function formatNumberLike(value) {\n      const text = plain(value);\n      if (!text) return \"\";\n      if (/萬|元|％|%/.test(text)) return text;\n      const cleaned = text.replace(/,/g, \"\");\n      if (/^\\d+(\\.\\d+)?$/.test(cleaned)) {\n        return Number(cleaned).toLocaleString(\"zh-TW\");\n      }\n      return text;\n    }\n\n    function optionHtml(value, selected) {\n      return `\u003coption ${String(value) === String(selected || \"\") ? \"selected\" : \"\"}\u003e${escapeHtml(value)}\u003c/option\u003e`;\n    }\n\n    function boolSelect(name, value = \"\") {\n      return `\n        \u003cselect data-field=\"${name}\"\u003e\n          ${yesNo.map(v =\u003e optionHtml(v, value || \"無\")).join(\"\")}\n        \u003c/select\u003e\n      `;\n    }\n\n    function locationTemplate(index, data = {}) {\n      return `\n        \u003cdiv class=\"location-block\" data-location\u003e\n          \u003cdiv class=\"location-head\"\u003e\n            \u003cspan\u003e處所 ${index + 1}\u003c/span\u003e\n            \u003cbutton class=\"btn danger remove-location\" type=\"button\"\u003e刪除\u003c/button\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"location-body\"\u003e\n            \u003cdiv class=\"grid\"\u003e\n              \u003clabel class=\"field\"\u003e名稱\n                \u003cinput data-field=\"siteName\" value=\"${escapeHtml(data.siteName || \"\")}\" placeholder=\"例：總公司、門市、倉庫\"\u003e\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e坪數\n                \u003cinput data-field=\"ping\" value=\"${escapeHtml(data.ping || \"\")}\" placeholder=\"例：318\"\u003e\n              \u003c/label\u003e\n              \u003clabel class=\"field wide\"\u003e處所地址\n                \u003cinput data-field=\"address\" value=\"${escapeHtml(data.address || \"\")}\"\u003e\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e使用性質\n                \u003cinput data-field=\"usageNature\" value=\"${escapeHtml(data.usageNature || \"\")}\" placeholder=\"例：辦公室、維修廠、倉庫\"\u003e\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e是否有招牌\n                ${boolSelect(\"signboard\", data.signboard)}\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e是否有電梯\n                ${boolSelect(\"elevator\", data.elevator)}\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e烤漆爐數量\n                \u003cinput data-field=\"paintOvenCount\" value=\"${escapeHtml(data.paintOvenCount || \"\")}\" placeholder=\"例：0\"\u003e\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e是否有修理廠\n                ${boolSelect(\"repairShop\", data.repairShop)}\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e樓層數\n                \u003cinput data-field=\"floorCount\" value=\"${escapeHtml(data.floorCount || \"\")}\" placeholder=\"例：2\"\u003e\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e火災受信總機\n                ${boolSelect(\"fireReceiver\", data.fireReceiver)}\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e消防撒水系統\n                ${boolSelect(\"sprinkler\", data.sprinkler)}\n              \u003c/label\u003e\n              \u003clabel class=\"field\"\u003e室外停車場\n                ${boolSelect(\"outdoorParking\", data.outdoorParking)}\n              \u003c/label\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      `;\n    }\n\n    function updateLocationNumbers() {\n      [...document.querySelectorAll(\"[data-location]\")].forEach((block, idx) =\u003e {\n        block.querySelector(\".location-head span\").textContent = `處所 ${idx + 1}`;\n      });\n    }\n\n    function addLocation(data = {}) {\n      const box = byId(\"locations\");\n      box.insertAdjacentHTML(\"beforeend\", locationTemplate(box.querySelectorAll(\"[data-location]\").length, data));\n      updateLocationNumbers();\n    }\n\n    function readLocations() {\n      return [...document.querySelectorAll(\"[data-location]\")].map(block =\u003e {\n        const obj = {};\n        block.querySelectorAll(\"[data-field]\").forEach(input =\u003e obj[input.dataset.field] = input.value);\n        return obj;\n      });\n    }\n\n    function renderClauses(selectedAll = true) {\n      byId(\"clauses\").innerHTML = DEFAULT_CLAUSES.map((name, idx) =\u003e `\n        \u003clabel class=\"check-row\"\u003e\n          \u003cinput type=\"checkbox\" class=\"clause-check\" value=\"${escapeHtml(name)}\" ${selectedAll ? \"checked\" : \"\"}\u003e\n          \u003cspan\u003e${idx + 1}. ${escapeHtml(name)}\u003c/span\u003e\n        \u003c/label\u003e\n      `).join(\"\");\n    }\n\n    function selectedClauses() {\n      const standard = [...document.querySelectorAll(\".clause-check:checked\")].map(el =\u003e el.value);\n      const custom = [...document.querySelectorAll(\".custom-clause-input\")].map(el =\u003e plain(el.value)).filter(Boolean);\n      return standard.concat(custom);\n    }\n\n    function addCustomClause(value = \"\") {\n      byId(\"customClauses\").insertAdjacentHTML(\"beforeend\", `\n        \u003cdiv class=\"grid\" style=\"grid-template-columns: 1fr 62px; margin-top: 8px\"\u003e\n          \u003cinput class=\"custom-clause-input\" value=\"${escapeHtml(value)}\" placeholder=\"輸入自訂附加條款名稱\"\u003e\n          \u003cbutton class=\"btn danger remove-custom-clause\" type=\"button\"\u003eX\u003c/button\u003e\n        \u003c/div\u003e\n      `);\n    }\n\n    function generateQuote() {\n      const locations = readLocations();\n      const clauses = selectedClauses();\n      const dateText = new Date().toLocaleDateString(\"zh-TW\");\n      const limitRows = [\n        [\"每一人體傷\", byId(\"limitPersonInjury\").value],\n        [\"每一事故體傷\", byId(\"limitAccidentInjury\").value],\n        [\"每一事故財損\", byId(\"limitPropertyDamage\").value],\n        [\"最高賠償限額\", byId(\"limitAggregate\").value],\n        [\"自負額\", byId(\"deductible\").value]\n      ].map(([label, value]) =\u003e `\u003ctr class=\"limit-row\"\u003e\u003ctd\u003e${label}\u003c/td\u003e\u003ctd\u003e${escapeHtml(formatNumberLike(value))}\u003c/td\u003e\u003c/tr\u003e`).join(\"\");\n\n      const locationRows = locations.map((loc, idx) =\u003e `\n        \u003ctr\u003e\n          \u003ctd\u003e${idx + 1}\u003c/td\u003e\n          \u003ctd\u003e${escapeHtml(loc.siteName || \"\")}\u003c/td\u003e\n          \u003ctd\u003e${escapeHtml(loc.address || \"\")}\u003c/td\u003e\n          \u003ctd style=\"text-align:right\"\u003e${escapeHtml(formatNumberLike(loc.ping))}\u003c/td\u003e\n          \u003ctd\u003e${escapeHtml(loc.usageNature || \"\")}\u003c/td\u003e\n          \u003ctd style=\"text-align:center\"\u003e${escapeHtml(loc.signboard || \"\")}\u003c/td\u003e\n          \u003ctd style=\"text-align:center\"\u003e${escapeHtml(loc.elevator || \"\")}\u003c/td\u003e\n          \u003ctd style=\"text-align:center\"\u003e${escapeHtml(formatNumberLike(loc.paintOvenCount))}\u003c/td\u003e\n          \u003ctd style=\"text-align:center\"\u003e${escapeHtml(loc.repairShop || \"\")}\u003c/td\u003e\n          \u003ctd style=\"text-align:center\"\u003e${escapeHtml(formatNumberLike(loc.floorCount))}\u003c/td\u003e\n          \u003ctd style=\"text-align:center\"\u003e${escapeHtml(loc.fireReceiver || \"\")}\u003c/td\u003e\n          \u003ctd style=\"text-align:center\"\u003e${escapeHtml(loc.sprinkler || \"\")}\u003c/td\u003e\n          \u003ctd style=\"text-align:center\"\u003e${escapeHtml(loc.outdoorParking || \"\")}\u003c/td\u003e\n        \u003c/tr\u003e\n      `).join(\"\");\n\n      byId(\"quotePreview\").innerHTML = `\n        \u003cdiv class=\"quote-title\"\u003e\n          \u003cdiv\u003e\n            \u003ch2\u003e處所公共意外責任保險報價單\u003c/h2\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"meta\"\u003e\n            \u003cdiv\u003e製表日期：${escapeHtml(dateText)}\u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003ch3\u003e被保險人資訊\u003c/h3\u003e\n        \u003cdiv class=\"info-grid\"\u003e\n          \u003cdiv class=\"info-label\"\u003e公司名稱\u003c/div\u003e\u003cdiv\u003e${escapeHtml(byId(\"companyName\").value)}\u003c/div\u003e\n          \u003cdiv class=\"info-label\"\u003e統一編號\u003c/div\u003e\u003cdiv\u003e${escapeHtml(byId(\"taxId\").value)}\u003c/div\u003e\n          \u003cdiv class=\"info-label\"\u003e代表人\u003c/div\u003e\u003cdiv\u003e${escapeHtml(byId(\"representative\").value)}\u003c/div\u003e\n          \u003cdiv class=\"info-label\"\u003e電話\u003c/div\u003e\u003cdiv\u003e${escapeHtml(byId(\"phone\").value)}\u003c/div\u003e\n          \u003cdiv class=\"info-label\"\u003e通訊地址\u003c/div\u003e\u003cdiv style=\"grid-column: span 3\"\u003e${escapeHtml(byId(\"mailingAddress\").value)}\u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003ch3\u003e公共意外險處所資料\u003c/h3\u003e\n        \u003ctable\u003e\n          \u003cthead\u003e\n            \u003ctr\u003e\n              \u003cth style=\"width:36px\"\u003e#\u003c/th\u003e\u003cth\u003e名稱\u003c/th\u003e\u003cth\u003e處所地址\u003c/th\u003e\u003cth\u003e坪數\u003c/th\u003e\u003cth\u003e使用性質\u003c/th\u003e\n              \u003cth\u003e招牌\u003c/th\u003e\u003cth\u003e電梯\u003c/th\u003e\u003cth\u003e烤漆爐\u003c/th\u003e\u003cth\u003e修理廠\u003c/th\u003e\u003cth\u003e樓層\u003c/th\u003e\u003cth\u003e火災受信總機\u003c/th\u003e\u003cth\u003e消防撒水系統\u003c/th\u003e\u003cth\u003e室外停車場\u003c/th\u003e\n            \u003c/tr\u003e\n          \u003c/thead\u003e\n          \u003ctbody\u003e${locationRows || `\u003ctr\u003e\u003ctd colspan=\"13\"\u003e尚未輸入處所資料\u003c/td\u003e\u003c/tr\u003e`}\u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003ch3\u003e報價額度\u003c/h3\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e${limitRows}\u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003ch3\u003e附加條款\u003c/h3\u003e\n        \u003col\u003e\n          ${clauses.map(name =\u003e `\u003cli\u003e${escapeHtml(name)}\u003c/li\u003e`).join(\"\") || \"\u003cli\u003e無\u003c/li\u003e\"}\n        \u003c/ol\u003e\n\n        \u003ch3\u003e備註\u003c/h3\u003e\n        \u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e${escapeHtml(byId(\"remarks\").value).replace(/\\n/g, \"\u003cbr\u003e\")}\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n      `;\n      byId(\"saveStatus\").textContent = \"已產生\";\n    }\n\n    function fillSample() {\n      byId(\"companyName\").value = \"範例汽車服務股份有限公司\";\n      byId(\"taxId\").value = \"00000000\";\n      byId(\"representative\").value = \"王小明\";\n      byId(\"phone\").value = \"02-0000-0000\";\n      byId(\"mailingAddress\").value = \"臺北市範例區測試路100號\";\n      byId(\"locations\").innerHTML = \"\";\n      addLocation({\n        siteName: \"範例-服務廠A\",\n        address: \"臺北市範例區測試路100號1樓及2樓\",\n        ping: \"318\",\n        usageNature: \"汽車展示及維修服務區\",\n        signboard: \"有\",\n        elevator: \"有\",\n        paintOvenCount: \"0\",\n        repairShop: \"無\",\n        floorCount: \"2\",\n        fireReceiver: \"有\",\n        sprinkler: \"有\",\n        outdoorParking: \"有\"\n      });\n      addLocation({\n        siteName: \"範例-倉儲廠\",\n        address: \"臺北市範例區倉儲路200號(全棟)\",\n        ping: \"421\",\n        usageNature: \"倉庫\",\n        signboard: \"有\",\n        elevator: \"無\",\n        paintOvenCount: \"0\",\n        repairShop: \"有\",\n        floorCount: \"2\",\n        fireReceiver: \"有\",\n        sprinkler: \"有\",\n        outdoorParking: \"無\"\n      });\n      byId(\"limitPersonInjury\").value = \"600萬\";\n      byId(\"limitAccidentInjury\").value = \"3000萬\";\n      byId(\"limitPropertyDamage\").value = \"500萬\";\n      byId(\"limitAggregate\").value = \"7000萬\";\n      byId(\"deductible\").value = \"5000\";\n      byId(\"remarks\").value = \"\";\n      renderClauses(true);\n      generateQuote();\n    }\n\n    function clearAll() {\n      [\n        \"companyName\", \"taxId\", \"representative\", \"phone\", \"mailingAddress\",\n        \"limitPersonInjury\", \"limitAccidentInjury\", \"limitPropertyDamage\", \"limitAggregate\",\n        \"deductible\", \"remarks\"\n      ].forEach(id =\u003e byId(id).value = \"\");\n      byId(\"locations\").innerHTML = \"\";\n      byId(\"customClauses\").innerHTML = \"\";\n      addLocation();\n      renderClauses(false);\n      byId(\"quotePreview\").innerHTML = `\u003cdiv class=\"empty\"\u003e填完左側資料後，按「產生報價單」。\u003c/div\u003e`;\n      byId(\"saveStatus\").textContent = \"已清空\";\n    }\n\n    document.addEventListener(\"click\", event =\u003e {\n      if (event.target.classList.contains(\"remove-location\")) {\n        event.target.closest(\"[data-location]\").remove();\n        updateLocationNumbers();\n      }\n      if (event.target.classList.contains(\"remove-custom-clause\")) {\n        event.target.closest(\".grid\").remove();\n      }\n    });\n\n    byId(\"addLocationBtn\").addEventListener(\"click\", () =\u003e addLocation());\n    byId(\"generateBtn\").addEventListener(\"click\", generateQuote);\n    byId(\"printBtn\").addEventListener(\"click\", () =\u003e { generateQuote(); window.print(); });\n    byId(\"sampleBtn\").addEventListener(\"click\", fillSample);\n    byId(\"clearBtn\").addEventListener(\"click\", clearAll);\n    byId(\"selectAllClausesBtn\").addEventListener(\"click\", () =\u003e {\n      document.querySelectorAll(\".clause-check\").forEach(el =\u003e el.checked = true);\n    });\n    byId(\"clearClausesBtn\").addEventListener(\"click\", () =\u003e {\n      document.querySelectorAll(\".clause-check\").forEach(el =\u003e el.checked = false);\n    });\n    byId(\"addCustomClauseBtn\").addEventListener(\"click\", () =\u003e addCustomClause());\n\n    renderClauses(true);\n    addLocation();\n  \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n" }
    };
    const homeBtn = document.getElementById("homeBtn");
    const frame = document.getElementById("toolFrame");
    function showHome() {
      document.body.classList.remove("tool-mode");
      frame.removeAttribute("srcdoc");
      homeBtn.classList.add("active");
      document.title = "保險報價整合系統 單檔版";
    }
    function showTool(name) {
      const tool = embeddedTools[name];
      frame.srcdoc = tool.html;
      document.body.classList.add("tool-mode");
      homeBtn.classList.remove("active");
      document.title = tool.title + " - 保險報價整合系統";
    }
    homeBtn.addEventListener("click", showHome);
    document.querySelectorAll("[data-tool]").forEach(button => button.addEventListener("click", () => showTool(button.dataset.tool)));
  </script>
</body>
</html>
