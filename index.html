<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保險報價整合系統</title>
  <style>
    :root {
      --ink: #172438;
      --muted: #5e6b78;
      --line: #cbd7e2;
      --head: #15324d;
      --head-2: #2f5f7c;
      --soft: #eef5f9;
      --paper: #fff;
      --yellow: #fff200;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      color: var(--ink);
      background: #f4f7fa;
    }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      background: var(--head);
      color: #fff;
      border-bottom: 4px solid #5e9fc0;
      padding: 14px 18px 12px;
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1680px;
      margin: 0 auto;
    }
    .brand h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0;
    }
    .brand p {
      margin: 4px 0 0;
      color: #dbeaf2;
      font-size: 13px;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .nav button {
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(255,255,255,.1);
      color: #fff;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav button.active {
      background: var(--yellow);
      color: #111;
      border-color: var(--yellow);
    }
    .home {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 34px;
    }
    .hero {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
    }
    .hero h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }
    .choice {
      display: grid;
      gap: 10px;
      align-content: start;
      text-align: left;
      min-height: 168px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 18px;
      cursor: pointer;
      color: var(--ink);
    }
    .choice:hover {
      border-color: #5e9fc0;
      box-shadow: 0 10px 22px rgba(21,50,77,.12);
    }
    .choice strong {
      font-size: 22px;
    }
    .choice span {
      color: var(--muted);
      line-height: 1.55;
    }
    .choice .tag {
      justify-self: start;
      background: var(--soft);
      border-left: 4px solid var(--head-2);
      color: var(--head);
      padding: 5px 9px;
      font-size: 13px;
      font-weight: 700;
    }
    .tool-wrap {
      display: none;
      min-height: calc(100vh - 86px);
      background: #f4f7fa;
    }
    .tool-frame {
      display: block;
      width: 100%;
      min-height: calc(100vh - 86px);
      height: calc(100vh - 86px);
      border: 0;
      background: #fff;
    }
    body.tool-mode .home { display: none; }
    body.tool-mode .tool-wrap { display: block; }
    @media (max-width: 760px) {
      .topbar-inner { align-items: flex-start; flex-direction: column; }
      .nav { justify-content: flex-start; }
      .choice-grid { grid-template-columns: 1fr; }
      .tool-frame { height: calc(100vh - 134px); min-height: calc(100vh - 134px); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1>保險報價整合系統</h1>
          <p>選擇險種後進入對應報價工具；各險種資料與欄位分開管理。</p>
        </div>
        <nav class="nav" aria-label="險種選單">
          <button type="button" id="homeBtn" class="active">首頁</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="home" id="home">
        <div class="hero">
          <h2>請選擇要製作的報價單</h2>
          <p>這個入口把商業火災保險與處所公共意外責任保險統合在同一個系統中。點選下方險種後，會直接進入對應的輸入與報價預覽畫面。</p>
          <div class="choice-grid">
            <button class="choice" type="button" data-tool="fire">
              <span class="tag">Commercial Fire</span>
              <strong>商火報價</strong>
              <span>輸入公司資料、標的物保額、天災與附加險設定，產生商業火災保險原始報價單。</span>
            </button>
            <button class="choice" type="button" data-tool="liability">
              <span class="tag">Public Liability</span>
              <strong>公共意外險</strong>
              <span>輸入處所資料、坪數、使用性質與責任限額，產生處所公共意外責任保險報價單。</span>
            </button>
          </div>
        </div>
      </section>

      <section class="tool-wrap" id="toolWrap" aria-label="報價工具">
        <iframe class="tool-frame" id="toolFrame" title="報價工具"></iframe>
      </section>
    </main>
  </div>

  <script>
    const tools = {
      fire: {
        title: "商火報價",
        src: "assets/commercial-fire-quote-tool.html"
      },
      liability: {
        title: "公共意外險",
        src: "assets/premises-public-liability-quote-tool.html"
      }
    };

    const buttons = {
      home: document.getElementById("homeBtn")
    };
    const frame = document.getElementById("toolFrame");

    function setActive(name) {
      Object.values(buttons).forEach(button => button.classList.remove("active"));
      if (buttons[name]) buttons[name].classList.add("active");
    }

    function showHome() {
      document.body.classList.remove("tool-mode");
      frame.removeAttribute("src");
      setActive("home");
      document.title = "保險報價整合系統";
    }

    function showTool(name) {
      const tool = tools[name];
      frame.src = tool.src;
      document.body.classList.add("tool-mode");
      setActive(name);
      document.title = `${tool.title} - 保險報價整合系統`;
    }

    buttons.home.addEventListener("click", showHome);
    document.querySelectorAll("[data-tool]").forEach(button => {
      button.addEventListener("click", () => showTool(button.dataset.tool));
    });
  </script>
</body>
</html>
